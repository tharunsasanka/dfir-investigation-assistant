services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: dfir
      POSTGRES_USER: dfir
      POSTGRES_PASSWORD: dfir

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U dfir -d dfir
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    working_dir: /app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql+psycopg://dfir:dfir@db:5432/dfir
      EVIDENCE_STORAGE_ROOT: /app/evidence_storage
      EVIDENCE_MAX_UPLOAD_BYTES: "104857600"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - evidence_data:/app/evidence_storage

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend

    restart: unless-stopped

    working_dir: /app

    command:
      - npm
      - run
      - dev
      - --
      - --host
      - 0.0.0.0

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  evidence_data: